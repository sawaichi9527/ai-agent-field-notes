# /etc/modprobe.d/nuc-audio-fix.conf
# Intel NUC6i5SYH / NUC6i5SYB
#   PCI 00:1f.3  Sunrise Point-LP HD Audio [8086:9d70]
#   codec       Realtek ALC283 (subsystem 8086:2063)
# Ubuntu 26.04 LTS / kernel 7.0.0-44-generic
# 2026-11-25 整理（取代舊版，舊版的 model= 是無效參數）

# (1) 強制走 legacy HDA。26.04 的 SOF / AVS 會先綁走 00:1f.3，analog 整組消失。
options snd-intel-dspcfg dsp_driver=1

# (2) ALC283 進入 D3 之後常常回不來（爆音、整段無聲）。controller 也一起禁止休眠。
options snd-hda-intel power_save=0 power_save_controller=0

# (3) 會跟 snd_hda_intel 搶 00:1f.3 的衝突模組。
blacklist snd_sof_pci_intel_skl
blacklist snd_sof_intel_hda_common
blacklist snd_soc_avs

# (4) 這裡刻意「不設」model=。
#     pin 組態由 BIOS 提供（0x21 = combo jack / HP out），generic auto 已經是對的。
#     歷史上寫過的 model=intel-nuc-headset-jack 與 model=alc283-dac 都不存在於
#     kernel 的 fixup 表，driver 會直接忽略（等於沒設），只會造成「以為設了」的誤判。
#     ALC283 真正存在的 model 只有這四個：
#         alc283-dac-wcaps   alc283-sense-combo   alc283-int-mic   alc283-headset
#     只有確定「插孔偵測不到」時才需要，屆時改成：
#         options snd-hda-intel model=alc283-sense-combo power_save=0 power_save_controller=0
